; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;você 
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = COM6
monitor_port = COM6
monitor_speed = 115200

monitor_dtr = 0
monitor_rts = 0

board_build.partitions = partitions_ota.csv

; -Os instrui o compilador a priorizar tamanho do binário em vez de velocidade
; Economiza 5-15% da flash sem mudar nada no código
; Raramente afeta performance em aplicações embarcadas como essa
build_flags = -Os

lib_deps =
  paulstoffregen/OneWire@^2.3.7             ; Biblioteca Leitura Temperatura
  milesburton/DallasTemperature@^3.11.0     ; Biblioteca Leitura Temperatura
  tzapu/WiFiManager@^2.0.16-rc.2            ; Biblioteca WifiManager
  bblanchon/ArduinoJson@^7.0.0              ; Biblioteca Json Arduino1
  